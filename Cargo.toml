[package]
name = "tab-keeper"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
description = "Lets people and agents list, close, group and arrange Chrome tabs across profiles"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A discarded Result is how "could not check" would turn into success.
let_underscore_must_use = "deny"
